# Club settings for the basketball clock.
# Change these on the Raspberry Pi in /opt/basketclock/club/config.ini (before enabling the
# read-only file system with install.boot). Removed lines fall back to the built-in defaults.

[club]
# Logo shown on the splash, config and score screen (designed for about 580 x 113 pixels)
logo = club/logo.svg

[display]
# auto = the resolution of the TV, or a fixed resolution like 1280x720
resolution = auto
# Show tenths of a second in the last minute (yes/no)
tenths = yes

[remote]
# Set to no when only a keyboard is used (also hides the connection dot)
enabled = yes
# Address of the Raspberry Pi on its own WiFi network, must match SERVER_IP in nodemcu/main.py
listen_ip = 10.3.141.1
port = 8080

[game]
timeout_seconds = 60
# GPIO pin of the piezo buzzer (other side to ground)
buzzer_pin = 16
